<!--
模板：时序图（diagram-templates，2026-11-08 用户定稿）
用在：几方之间按先后顺序来回发消息、调用、等待。
固定部分：
- 参与方 = 顶部灯管卡片（标题 15px 粗体居中 + 13px 说明，说明可省），每方一种分类色，第 5 方用中性色。
- 生命线 = 同色虚线；消息文字跨过别的生命线时，生命线在文字处断开。
- 请求画实线，返回画虚线。编号圆 + 消息文字（13px）放在箭头上方，从发送方一侧排起。
- 处理中 = 生命线上 10px 宽的竖条；处理说明 = 竖条旁的细框卡片，颜色同参与方。
- 阶段带 = 一条虚线 + 左边的阶段名胶囊。
- 编号和彗星的颜色 = 收消息、接着干活的一方。图例在图底部一行。
内容怎么增减：
- 参与方 2～5 个：每列宽 = 712 ÷ 参与方数，生命线在列中间；卡片宽 = min(200, 列宽 − 12)；4 方时标题不超过 10 个汉字，5 方时不超过 7 个，放不下就换行。
- 消息 3～14 条：超过 12 条按阶段分段，超过 14 条拆成两张。
- 消息文字每行不超过 250px（约 19 个汉字），处理说明每行不超过 264px（约 20 个汉字），各最多 3 行。
- 一行的竖向尺寸：文字高 12 + 20 × 行数，箭头在文字下方 8，处理说明在箭头下方 10，行与行之间 18。
- 一方同时发给两方时，画一条线再分叉到第二方，编号只有一个。

通用约定（6 个模板相同）：
- 风格：C2 通电点亮。节点是霓虹灯管卡片：底框 + 熄灭时的暗描边 + 点亮层（彩色粗管 .tg + 白芯 .tc）。
- 颜色变量都以 --dg- 开头。文字色、次要文字色、卡片底色、分隔线对到宿主的主题变量（--foreground、--muted-foreground、--card、--border），宿主没有这些变量时用逗号后面的固定值；分类色（青、绿、品红、琥珀，回流用橙）是模板自己的两套取值。深浅两套按 prefers-color-scheme 切换：浅色是默认，深色写在 <style> 末尾的 @media 里。
- 动画：一轮 12 秒（时序图 14 秒），每档 5%。第 k 档的元素用类 igK 闪亮，导线用 dwK 画出（长度类 lNNN 等于路径长度），彗星用 tK 出发；88% 起全部熄灭再循环。系统设了"减少动态"时整张静止全亮。增删步骤时同步改这三种类。
- 一个页面只放一张图：各模板的类名、动画名相同但取值不同，两张不同模板的图放进同一页会互相覆盖。
- 要换的内容在 <!-- 内容 --> 和 <!-- 内容结束 --> 之间，其余是固定部分。放不下就删字或换行，不缩字号。
-->
