<!--
模板：流程图·有泳道（diagram-templates，2026-11-08 用户定稿）
用在：一件事分几步、每一步由谁做、在哪里并行或回流。
固定部分：
- 泳道竖排等宽，泳道名 15px 粗体居中、用泳道色；每条泳道一种分类色，最多 4 种。
- 节点 192 宽的灯管卡片：左上编号圆 Ø24（g.badge，数字 14px 粗体），标题 15px 粗体，说明 13px、行距 20；高度 70 起，每多一行说明加 20。
- 导线 2.5px，箭头是画出来的三角形（不用 marker）；一步分给多方同时做时用一根横的分叉条；回流用橙色虚线，走最外侧通道，不穿节点。
- 箭头标签是胶囊，压在线段中间，13px 粗体，写清这条线的含义（例："不通过，先改：回 2 或 3"）。
- 彗星颜色 = 下一步由谁做；图例放在图底部一行。
内容怎么增减：
- 泳道 1～4 条。3 条时各 231px、节点 192px：标题不超过 9 个汉字，说明每行不超过 10 个汉字、最多 5 行，再长就挪进回复正文。4 条时泳道 172px、节点 148px：标题不超过 6 个汉字，说明每行不超过 7 个汉字。1 条时节点仍是 192px。
- 步骤超过 12 步拆成两张图。

通用约定（6 个模板相同）：
- 风格：C2 通电点亮。节点是霓虹灯管卡片：底框 + 熄灭时的暗描边 + 点亮层（彩色粗管 .tg + 白芯 .tc）。
- 颜色变量都以 --dg- 开头。文字色、次要文字色、卡片底色、分隔线对到宿主的主题变量（--foreground、--muted-foreground、--card、--border），宿主没有这些变量时用逗号后面的固定值；分类色（青、绿、品红、琥珀，回流用橙）是模板自己的两套取值。深浅两套按 prefers-color-scheme 切换：浅色是默认，深色写在 <style> 末尾的 @media 里。
- 动画：一轮 12 秒（时序图 14 秒），每档 5%。第 k 档的元素用类 igK 闪亮，导线用 dwK 画出（长度类 lNNN 等于路径长度），彗星用 tK 出发；88% 起全部熄灭再循环。系统设了"减少动态"时整张静止全亮。增删步骤时同步改这三种类。
- 一个页面只放一张图：各模板的类名、动画名相同但取值不同，两张不同模板的图放进同一页会互相覆盖。
- 要换的内容在“内容”与“内容结束”标记之间，其余是固定部分。放不下就删字或换行，不缩字号。
-->
