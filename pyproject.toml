[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shipping-billing-agent"
version = "0.1.0"
description = "多格式文档解析的航运智能账单助手智能体"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "langchain>=1.0",
  "langgraph>=1.0",
  "langchain-openai>=1.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "beautifulsoup4>=4.12",
  "pdfplumber>=0.11",
  "Pillow>=10.0",
  "rapidocr-onnxruntime>=1.4",
  "openpyxl>=3.1",
  "xlrd>=2.0.1",
  "python-docx>=1.1",
  "legacy-doc>=0.2.1",
  "iso4217>=1.16",
  "typer>=0.12",
  "rich>=13.7",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
]

[project.scripts]
shipping-billing-agent = "shipping_billing_agent.cli.app:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "playwright>=1.49",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shipping_billing_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live_ocr: calls configured remote OCR gateway",
  "live_llm: calls live LLM API",
  "browser: runs isolated Playwright browser tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
