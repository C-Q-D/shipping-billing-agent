services:
  app:
    image: shipping-billing-agent:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      ALLOW_REMOTE_BIND: "true"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      APP_DATA_DIR: "/app/data"
      SQLITE_DB_PATH: "/app/data/shipping_billing.db"
      APP_TRUST_PROXY_HEADERS: "${APP_TRUST_PROXY_HEADERS:-true}"
      APP_RATE_LIMIT_PER_MINUTE: "${APP_RATE_LIMIT_PER_MINUTE:-180}"
      APP_HEAVY_RATE_LIMIT_PER_MINUTE: "${APP_HEAVY_RATE_LIMIT_PER_MINUTE:-6}"
      APP_DAILY_HEAVY_QUOTA: "${APP_DAILY_HEAVY_QUOTA:-60}"
      APP_MAX_CONCURRENT_HEAVY: "${APP_MAX_CONCURRENT_HEAVY:-2}"
      APP_DISABLE_LIVE_EVAL: "${APP_DISABLE_LIVE_EVAL:-true}"
      APP_ACCESS_EXPIRES_AT: "${APP_ACCESS_EXPIRES_AT:-}"
      APP_ACCESS_PASSCODE: "${APP_ACCESS_PASSCODE:-}"
      APP_ACCESS_SESSION_HOURS: "${APP_ACCESS_SESSION_HOURS:-24}"
    volumes:
      - billing-data:/app/data
    expose:
      - "8000"
    mem_limit: "${APP_MEM_LIMIT:-1536m}"
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  proxy:
    image: shipping-billing-proxy:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile.proxy
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${DEPLOY_BIND_IP:-0.0.0.0}:${DEPLOY_PORT:-8080}:80"
    environment:
      BASIC_AUTH_USER: "${BASIC_AUTH_USER:-reviewer}"
      BASIC_AUTH_PASS: "${BASIC_AUTH_PASS:-}"
      ALLOWED_CIDRS: "${ALLOWED_CIDRS:-}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
    mem_limit: "128m"
    pids_limit: 64
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  billing-data:
