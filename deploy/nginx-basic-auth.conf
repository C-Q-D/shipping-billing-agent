include /etc/nginx/realip.conf;

limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}
map $request_method $heavy_limit_key {
    default "";
    POST $binary_remote_addr;
}
map $request_method $auth_limit_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $heavy_limit_key zone=heavy_limit:10m rate=6r/m;
limit_req_zone $auth_limit_key zone=auth_limit:10m rate=5r/m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 32m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;

    proxy_hide_header X-Content-Type-Options;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After "10" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 429 '{"code":"RATE_LIMITED","message":"请求过于频繁，请稍后再试","details":{},"request_id":"edge-rate-limit"}';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ~ /\. {
        return 404;
    }

    location = /_access/login {
        limit_except GET POST OPTIONS {
            deny all;
        }
        include /etc/nginx/allowlist.conf;
        limit_conn conn_per_ip 10;
        limit_req zone=general_limit burst=20 nodelay;
        limit_req zone=auth_limit burst=5 nodelay;

        include /etc/nginx/proxy_common.conf;
    }

    location ~ ^/api/v1/(?:batches(?:/demo|/[^/]+/documents/[^/]+/(?:retry|force-parse))?|eval-runs)/?$ {
        limit_except GET POST OPTIONS {
            deny all;
        }
        include /etc/nginx/allowlist.conf;
        limit_conn conn_per_ip 20;
        limit_req zone=general_limit burst=40 nodelay;
        limit_req zone=heavy_limit burst=4 nodelay;

        include /etc/nginx/auth.conf;
        include /etc/nginx/proxy_common.conf;
    }

    location / {
        limit_except GET POST PUT PATCH DELETE OPTIONS {
            deny all;
        }
        include /etc/nginx/allowlist.conf;
        limit_conn conn_per_ip 20;
        limit_req zone=general_limit burst=40 nodelay;

        include /etc/nginx/auth.conf;
        include /etc/nginx/proxy_common.conf;
    }
}
